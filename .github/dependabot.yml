# dependabot.yml — PRs semanais de atualização (npm e Actions). Patch e minor vêm agrupados num PR só.
# Versão maior vem em PR próprio e só o responsável decide (react-router 7 e zod 4: ver docs/adr/0001-alertas-react-router-zod.md).
# Os alertas de segurança se ligam em Settings, não aqui (issue "Ligar os alertas do Dependabot").
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      patch-e-minor:
        update-types: ["patch", "minor"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

# Fim de dependabot.yml
