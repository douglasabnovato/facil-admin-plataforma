# manter-ativo.yml — consulta leve semanal para o projeto Supabase gratuito não pausar por inatividade.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "${{ vars.VITE_SUPABASE_URL }}/rest/v1/categorias?select=slug&limit=1" \
            -H "apikey: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}" > /dev/null && echo "Supabase respondeu"

# Fim de manter-ativo.yml
